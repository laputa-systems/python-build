name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  PYTHON_VERSION: "3.15.1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_TOOLCHAIN: "nightly-2026-09-15"

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

  test:
    name: Fast controller tests
    needs: preflight
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Run fast controller tests
        run: python3.15 -m unittest discover -s tests

  build-macos:
    runs-on: xcode-27
    needs: [preflight, test]
    permissions:
      contents: read
    env:
      CANDIDATE_RUN_DIR: ${{ github.workspace }}/.work/tmp/openssl-free-macos
      REGRESSION_RUN_DIR: ${{ github.workspace }}/.work/tmp/openssl-free-macos-regression
      ARCHIVE_RUN_DIR: ${{ github.workspace }}/.work/tmp/openssl-free-macos-archive
      ARCHIVE_NAME: cpython-3.15.1-aarch64-apple-darwin-r2.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Exclude task-local scratch
        run: |
          set -eu
          exclude="$(git rev-parse --git-path info/exclude)"
          if ! grep --quiet --fixed-strings --line-regexp ".work/" "$exclude"; then
            printf '\n.work/\n' >> "$exclude"
          fi
          mkdir -p .work/tmp

      - name: Cache verified build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/objects
            .cache/llvm
          key: macos-inputs-${{ hashFiles('sources.lock.json', 'bootstrap.lock.json') }}
          restore-keys: macos-inputs-

      - name: Install missing host tools
        run: |
          set -eu
          for formula in make pkgconf; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done

      - name: Install the pinned Rust toolchain
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Fetch locked inputs and LLVM
        run: python3.15 build.py fetch --target aarch64-apple-darwin

      - name: Build the OpenSSL reference interpreter
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          python3.15 build.py build --target aarch64-apple-darwin

      - name: Build and qualify the native OpenSSL-free candidate
        env:
          GITHUB_SHA: ${{ github.sha }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
          PYTHON_BUILD_SOURCE_REVISION: ${{ github.sha }}
          PYTHON_BUILD_SOURCE_DIRTY: "0"
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          if command -v nproc >/dev/null 2>&1; then JOBS="$(nproc)"; else JOBS="$(sysctl -n hw.ncpu)"; fi
          python3.15 backend/build-no-openssl.py \
            --phase fetch \
            --run-dir "$CANDIDATE_RUN_DIR"
          python3.15 backend/build-no-openssl.py \
            --phase base \
            --run-dir "$CANDIDATE_RUN_DIR" \
            --jobs "$JOBS"
          python3.15 backend/build-no-openssl.py \
            --phase overlay \
            --prefix "$CANDIDATE_RUN_DIR/prefix" \
            --run-dir "$CANDIDATE_RUN_DIR" \
            --jobs "$JOBS"
          python3.15 backend/qualify-no-openssl-regressions.py \
            --prefix "$CANDIDATE_RUN_DIR/relocated prefix" \
            --run-dir "$REGRESSION_RUN_DIR" \
            --jobs "$JOBS"
          python3.15 backend/qualify-no-openssl-archive.py \
            --prefix "$CANDIDATE_RUN_DIR/relocated prefix" \
            --build-run-dir "$CANDIDATE_RUN_DIR" \
            --reference-python "$GITHUB_WORKSPACE/build/stage/cpython-staged/install/bin/python3.15" \
            --certdata "$CANDIDATE_RUN_DIR/cpython-source/Python-3.15.1/Lib/test/certdata" \
            --regression-report "$REGRESSION_RUN_DIR/report.json" \
            --run-dir "$ARCHIVE_RUN_DIR" \
            --archive-name "$ARCHIVE_NAME" \
            --manifest-name artifact.json

      - name: Promote the candidate to the official dist layout
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          python3.15 build/promote_openssl_free.py \
            --run-dir "$CANDIDATE_RUN_DIR" \
            --archive-dir "$ARCHIVE_RUN_DIR" \
            --triple aarch64-apple-darwin \
            --revision "$GITHUB_SHA" \
            --archive-name "$ARCHIVE_NAME" \
            --manifest-name artifact.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: dist/aarch64-apple-darwin
          if-no-files-found: error

      - name: Preserve failed qualification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-openssl-free-aarch64-apple-darwin-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.CANDIDATE_RUN_DIR }}/logs/
            ${{ env.REGRESSION_RUN_DIR }}/
            ${{ env.ARCHIVE_RUN_DIR }}/
          if-no-files-found: warn

  build-linux:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-26.04
            platform: linux/amd64
            triple: x86_64-unknown-linux-musl
            cache-scope: linux-amd64
          - runs-on: ubuntu-26.04-arm
            platform: linux/arm64
            triple: aarch64-unknown-linux-musl
            cache-scope: linux-arm64
    runs-on: ${{ matrix.runs-on }}
    needs: [preflight, test]
    permissions:
      contents: read
    env:
      EXPERIMENT_RUN_DIR: ${{ github.workspace }}/.work/tmp/openssl-free-${{ matrix.cache-scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Exclude task-local scratch
        run: |
          set -eu
          exclude="$(git rev-parse --git-path info/exclude)"
          if ! grep --quiet --fixed-strings --line-regexp ".work/" "$exclude"; then
            printf '\n.work/\n' >> "$exclude"
          fi
          mkdir -p .work/tmp

      - name: Restore verified Linux inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/objects
            .cache/bootstrap
          key: linux-inputs-${{ matrix.cache-scope }}-${{ hashFiles('sources.lock.json', 'bootstrap.lock.json', 'backend/linux-bootstrap.lock.json', 'backend/linux-bootstrap-x86_64.json') }}
          restore-keys: linux-inputs-${{ matrix.cache-scope }}-

      - name: Run fast controller tests
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          python3.15 build.py controller-test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and qualify the native OpenSSL-free candidate
        env:
          GITHUB_SHA: ${{ github.sha }}
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          python3.15 backend/docker-linux.py \
            --phase all \
            --target "${{ matrix.triple }}" \
            --run-dir "$EXPERIMENT_RUN_DIR" \
            --jobs "$(nproc)" \
            --source-revision "$GITHUB_SHA" \
            --archive-name "cpython-${PYTHON_VERSION}-${{ matrix.triple }}-r2.tar.gz" \
            --manifest-name artifact.json

      - name: Validate qualification evidence and promote to dist
        env:
          GITHUB_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.triple }}
        run: |
          set -eu
          python3.15 .github/scripts/validate_experimental_artifact.py \
            --directory "$EXPERIMENT_RUN_DIR/qualification/archive" \
            --build-directory "$EXPERIMENT_RUN_DIR" \
            --revision "$GITHUB_SHA" \
            --manifest-name artifact.json
          python3.15 build/promote_openssl_free.py \
            --run-dir "$EXPERIMENT_RUN_DIR" \
            --triple "$TARGET" \
            --revision "$GITHUB_SHA" \
            --archive-name "cpython-${PYTHON_VERSION}-${TARGET}-r2.tar.gz" \
            --manifest-name artifact.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.triple }}
          path: dist/${{ matrix.triple }}
          if-no-files-found: error

      - name: Preserve failed qualification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-openssl-free-${{ matrix.triple }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.EXPERIMENT_RUN_DIR }}/logs/
            ${{ env.EXPERIMENT_RUN_DIR }}/reference-build/logs/
            ${{ env.EXPERIMENT_RUN_DIR }}/qualification/regression/*.log
            ${{ env.EXPERIMENT_RUN_DIR }}/qualification/regression/report.json
            ${{ env.EXPERIMENT_RUN_DIR }}/qualification/archive/*.json
            ${{ env.EXPERIMENT_RUN_DIR }}/qualification/archive/contracts/logs/
          if-no-files-found: warn

  assemble:
    name: Assemble release assets
    runs-on: ubuntu-26.04-arm
    needs: [preflight, build-macos, build-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          path: dist/aarch64-apple-darwin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist/x86_64-unknown-linux-musl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist/aarch64-unknown-linux-musl

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Assemble and validate release assets
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          build_id=$(date -u +%Y%m%d)
          python3.15 build/uvmirror.py --build "$build_id" --repo "$GITHUB_REPOSITORY" --dist dist --out release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error

  smoke-macos:
    runs-on: xcode-27
    needs: [preflight, assemble]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Download and verify uv 0.13.4
        env:
          UV_VERSION: "0.13.4"
          UV_ARCHIVE: uv-aarch64-apple-darwin.tar.gz
          UV_SHA256: e0b1d4743ce64c55d9f0f4a444afa6b81125680070ee04e853fcd0f6c1ebf8f1
          UV_TARGET: uv-aarch64-apple-darwin
        run: |
          set -eu
          work="$GITHUB_WORKSPACE/.work/uv-smoke"
          mkdir -p "$work"
          archive="$work/$UV_ARCHIVE"
          curl --fail --location --output "$archive" \
            "https://releases.astral.sh/github/uv/releases/download/$UV_VERSION/$UV_ARCHIVE"
          printf '%s  %s\n' "$UV_SHA256" "$archive" | shasum -a 256 --check -
          tar -xzf "$archive" -C "$work" "$UV_TARGET/uv"
          mkdir -p "$work/uv-bin"
          install -m 0755 "$work/$UV_TARGET/uv" "$work/uv-bin/uv"
          case "$("$work/uv-bin/uv" --version)" in
            "uv $UV_VERSION"|"uv $UV_VERSION "*) ;;
            *) exit 1 ;;
          esac

      - name: Smoke exact assembled bytes through uv
        env:
          RELEASE_TAG: release-${{ github.sha }}
          UV_PYTHON_INSTALL_MIRROR: file://${{ github.workspace }}/mirror
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.work/uv-smoke/python
          UV_CACHE_DIR: ${{ github.workspace }}/.work/uv-smoke/cache
          UV_PYTHON_CACHE_DIR: ${{ github.workspace }}/.work/uv-smoke/python-cache
          EXPECTED_PLATFORM: darwin
          EXPECTED_MACHINE: arm64
        run: |
          set -eu
          rm -rf "$GITHUB_WORKSPACE/.work/uv-smoke/python" \
            "$GITHUB_WORKSPACE/.work/uv-smoke/cache" \
            "$GITHUB_WORKSPACE/.work/uv-smoke/python-cache"
          mkdir -p "$UV_PYTHON_INSTALL_DIR" "$UV_CACHE_DIR" "$UV_PYTHON_CACHE_DIR"
          mkdir -p "mirror/$RELEASE_TAG"
          cp release/*.tar.gz "mirror/$RELEASE_TAG/"
          (cd release && shasum -a 256 --check SHA256SUMS)
          key="cpython-${PYTHON_VERSION}-darwin-aarch64-none"
          "$GITHUB_WORKSPACE/.work/uv-smoke/uv-bin/uv" python install "$key" \
            --python-downloads-json-url "$GITHUB_WORKSPACE/release/smoke-metadata.json"
          python_path="$("$GITHUB_WORKSPACE/.work/uv-smoke/uv-bin/uv" python find --system "$key")"
          "$python_path" .github/scripts/verify_uv_python.py "$UV_PYTHON_INSTALL_DIR"
          "$python_path" .github/scripts/toy.py

  smoke-linux:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-26.04
            platform: linux/amd64
            runtime_image: alpine@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
            uv_target: x86_64-unknown-linux-musl
            uv_key_suffix: linux-x86_64-musl
            expected_machine: x86_64
            uv_sha256: 28d4385f9f9d1d1c7654d85b3855e0e2615b2f6cc13136a2edff858bbdc16ff1
          - runs-on: ubuntu-26.04-arm
            platform: linux/arm64
            runtime_image: alpine@sha256:260479a1cfaf304c4c20da7f8405d3ce313513dcd534bb743257bdd2fe0f3e2d
            uv_target: aarch64-unknown-linux-musl
            uv_key_suffix: linux-aarch64-musl
            expected_machine: aarch64
            uv_sha256: 253a17cadcb659ae77a0fe3b9a2f1c14297528d480c421899e61e64d64f24e8f
    runs-on: ${{ matrix.runs-on }}
    needs: [preflight, assemble]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Smoke exact assembled bytes through uv in musl
        env:
          RELEASE_TAG: release-${{ github.sha }}
          UV_VERSION: "0.13.4"
          UV_TARGET: ${{ matrix.uv_target }}
          UV_KEY_SUFFIX: ${{ matrix.uv_key_suffix }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          UV_PYTHON_INSTALL_DIR: /work/.work/uv-smoke/python
          UV_CACHE_DIR: /work/.work/uv-smoke/cache
          UV_PYTHON_CACHE_DIR: /work/.work/uv-smoke/python-cache
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/.work/uv-smoke" "mirror/$RELEASE_TAG"
          cp release/*.tar.gz "mirror/$RELEASE_TAG/"
          (cd release && sha256sum --check SHA256SUMS)
          docker run --platform "${{ matrix.platform }}" --rm \
            --volume "$PWD/release:/release:ro" \
            --volume "$PWD/mirror:/mirror:ro" \
            --volume "$PWD/.github/scripts:/scripts:ro" \
            --volume "$PWD/.work:/work/.work" \
            --env RELEASE_TAG \
            --env PYTHON_VERSION \
            --env UV_VERSION \
            --env UV_TARGET \
            --env UV_KEY_SUFFIX \
            --env UV_SHA256 \
            --env EXPECTED_MACHINE \
            --env UV_PYTHON_INSTALL_DIR \
            --env UV_CACHE_DIR \
            --env UV_PYTHON_CACHE_DIR \
            --env EXPECTED_PLATFORM=linux \
            "${{ matrix.runtime_image }}" sh -ec '
              apk add --no-cache ca-certificates curl tar
              test -z "$(find / -xdev -name libgcc_s.so\* -print)"
              archive="uv-$UV_TARGET.tar.gz"
              curl --fail --location --output "/work/.work/uv-smoke/$archive" \
                "https://releases.astral.sh/github/uv/releases/download/$UV_VERSION/$archive"
              printf "%s  %s\n" "$UV_SHA256" "/work/.work/uv-smoke/$archive" | sha256sum -c -
              tar -xzf "/work/.work/uv-smoke/$archive" -C /work/.work/uv-smoke "uv-$UV_TARGET/uv"
              install -m 0755 "/work/.work/uv-smoke/uv-$UV_TARGET/uv" /usr/local/bin/uv
              case "$(uv --version)" in
                "uv $UV_VERSION"|"uv $UV_VERSION "*) ;;
                *) exit 1 ;;
              esac
              rm -rf /work/.work/uv-smoke/python /work/.work/uv-smoke/cache /work/.work/uv-smoke/python-cache
              mkdir -p "$UV_PYTHON_INSTALL_DIR" "$UV_CACHE_DIR" "$UV_PYTHON_CACHE_DIR"
              (cd /release && sha256sum -c SHA256SUMS)
              export UV_PYTHON_INSTALL_MIRROR=file:///mirror
              key="cpython-${PYTHON_VERSION}-${UV_KEY_SUFFIX}"
              uv python install "$key" --python-downloads-json-url /release/smoke-metadata.json
              python_path="$(uv python find --system "$key")"
              "$python_path" /scripts/verify_uv_python.py "$UV_PYTHON_INSTALL_DIR"
              "$python_path" /scripts/toy.py
            '

  release:
    name: Create pre-release
    needs: [preflight, assemble, smoke-macos, smoke-linux]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          else
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
              exit 1
            fi
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Verify assembled release hashes
        run: (cd release && sha256sum -c SHA256SUMS)

      - name: Verify the standard assets of every target
        run: |
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -f "release/cpython-$PYTHON_VERSION-$target.tar.xz"
            manifest="release/cpython-$PYTHON_VERSION-$target.manifest.json"
            test -f "$manifest"
            jq -e --arg target "$target" --arg revision "$GITHUB_SHA" \
              '.schema_version == 1 and .target == $target and .source_revision == $revision' "$manifest" >/dev/null
          done

      - name: Create release tag at triggering SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          else
            printf 'Could not create release tag %s at %s: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" "$response" >&2
            exit 1
          fi

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then
            printf 'Initial release at %s.\n' "$GITHUB_SHA" > "$notes"
            exit 0
          fi
          compare="repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA"
          status=$(gh api "$compare" --jq '.status')
          if [[ "$status" != ahead ]]; then
            printf 'Release notes rejected: %s is %s relative to %s, expected ahead\n' "$GITHUB_SHA" "$status" "$previous" >&2
            exit 1
          fi
          {
            printf '## Changes since %s\n\n' "$previous"
            gh api --paginate "$compare?per_page=100" --jq '.commits[] | "- \(.sha[0:12]) \(.commit.message | split("\n")[0])"'
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA"
          } > "$notes"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$RELEASE_TAG"

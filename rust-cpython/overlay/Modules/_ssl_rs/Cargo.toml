[package]
name = "_ssl_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
cpython-sys = { path = "../cpython-sys" }
rustls = { version = "=0.23.46", default-features = false, features = ["tls12", "std"] }
webpki = { package = "rustls-webpki", version = "=0.103.17", default-features = false, features = ["std"] }
rustls-graviola = "=0.4.0"
rustls-pki-types = "=1.15.1"
rustls-pemfile = "=2.2.0"
x509-parser = { version = "=0.18.1", features = ["verify"] }
sha1 = { version = "=0.11.0", default-features = false }
pkcs8 = { version = "=0.11.0", features = ["encryption", "pem", "std"] }
pem-rfc7468 = { version = "=1.0.0", features = ["alloc"] }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_ssl_rs"
crate-type = ["cdylib", "rlib"]

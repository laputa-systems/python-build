[package]
name = "_pickle_rs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "PSF-2.0"

[dependencies]
cpython-sys = { path = "../cpython-sys" }
deser = { version = "0.10.2", default-features = false, features = ["std"] }
deser-pickle = { version = "0.10.2", default-features = false, features = ["std"] }

[build-dependencies]
cpython-build-helper = { path = "../cpython-build-helper" }

[lib]
name = "_pickle_rs"
crate-type = ["cdylib", "rlib"]

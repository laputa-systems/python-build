[project]
name = "python-build"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = ["laputa-buildlib==0.2.0"]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "ty==0.0.104",
    "uv==0.13.8",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = false

[tool.ruff]
target-version = "py315"
extend-exclude = ["rust-cpython/overlay", "backend/vendor", "benchmarks/workloads/fixtures", "rust-cpython/serc-overlay/crates/serc/tests/fixtures", "docs/campaign-evidence"]

[tool.ty.environment]
python-version = "3.15"

[[tool.uv.index]]
url = "https://pypi.17166969.xyz/current/simple/"
default = true

[tool.ruff.lint.per-file-ignores]
"rust-cpython/tests/jit_*_integration.py" = ["S102", "PLW1510", "PLE0304", "PLE0305"]
